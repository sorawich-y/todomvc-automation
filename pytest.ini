[pytest]
testpaths = tests
addopts =
    --base-url=https://todomvc.com
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html
    -ra
markers =
    smoke: fast critical-path checks, run on every commit
    regression: full behaviour suite
filterwarnings =
    # raised inside the pytest-base-url plugin on pytest 9, not by this suite
    ignore:Session-scoped fixtures defined as instance methods:DeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
